name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: fugu-linux-x86_64
            binary_name: fugu

          - os: windows-latest
            artifact_name: fugu-windows-x86_64
            binary_name: fugu.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace

      - name: Build release binary
        run: cargo build --release -p fugu

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir "${{ matrix.artifact_name }}"
          cp "target/release/${{ matrix.binary_name }}" "${{ matrix.artifact_name }}/"
          cp README.md "${{ matrix.artifact_name }}/"
          tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ matrix.artifact_name }}"
          Copy-Item "target/release/${{ matrix.binary_name }}" "${{ matrix.artifact_name }}/"
          Copy-Item "README.md" "${{ matrix.artifact_name }}/"
          Compress-Archive `
            -Path "${{ matrix.artifact_name }}/*" `
            -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/fugu-linux-x86_64/fugu-linux-x86_64.tar.gz \
            artifacts/fugu-windows-x86_64/fugu-windows-x86_64.zip \
            --generate-notes \
            --title "Fugu ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}